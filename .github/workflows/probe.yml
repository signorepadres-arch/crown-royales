name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'
          echo "plain curl: $(curl -s -o /dev/null -w '%{http_code}' "$U")"
          echo "browser UA: $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' "$U")"
          echo "bot UA: $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (CrownRoyalesBot)' "$U")"
          echo "limit param: $(curl -s -o /dev/null -w '%{http_code}' "$U?limit=500")"
          echo "cfb groups: $(curl -s -o /dev/null -w '%{http_code}' "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80")"
          echo "core odds: $(curl -s -o /dev/null -w '%{http_code}' "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026")"
          echo "site.web: $(curl -s -o /dev/null -w '%{http_code}' "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")"
          echo "cdn: $(curl -s -o /dev/null -w '%{http_code}' "https://cdn.espn.com/core/nfl/scoreboard?xhr=1")"
          curl -s -A 'Mozilla/5.0 (CrownRoyalesBot)' "$U" | head -c 300; echo
          node -e "fetch('$U',{headers:{'User-Agent':'Mozilla/5.0 (CrownRoyalesBot)',Accept:'application/json'}}).then(r=>console.log('node fetch bot+accept',r.status))"
          node -e "fetch('$U').then(r=>console.log('node fetch plain',r.status))"
